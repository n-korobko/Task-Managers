{% extends "base.html" %}

{% block content %}
  <h2>Delete task</h2>

  <p>Are you sure you want to delete "<strong>{{ object.name }}</strong>"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'core:my-task-list' %}">Cancel</a>
  </form>
{% endblock %}
